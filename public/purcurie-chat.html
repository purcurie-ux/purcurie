<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Purcurie AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #212121;
    color: #ececec;
    height: 100%; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .menu-btn {
    background: none; border: none; cursor: pointer;
    padding: 4px; display: flex; flex-direction: column;
    gap: 4px; position: relative;
  }
  .menu-btn span { display: block; width: 20px; height: 2px; background: #ececec; border-radius: 1px; }
  .menu-btn .dot {
    position: absolute; top: 0; right: 0;
    width: 7px; height: 7px; background: #3b82f6;
    border-radius: 50%; border: 1.5px solid #212121;
  }
  .model-selector {
    display: flex; align-items: center; gap: 5px;
    background: none; border: none; color: #ececec;
    font-size: 17px; font-weight: 600; cursor: pointer;
    font-family: inherit; letter-spacing: -0.3px;
  }
  .model-selector svg { width: 16px; height: 16px; opacity: 0.7; }
  .topbar-right { display: flex; align-items: center; gap: 2px; }
  .icon-btn {
    width: 38px; height: 38px; background: none; border: none;
    cursor: pointer; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; color: #ececec;
  }
  .icon-btn svg { width: 22px; height: 22px; }

  .messages {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 0 0 8px; display: flex; flex-direction: column;
    -webkit-overflow-scrolling: touch;
  }
  .messages::-webkit-scrollbar { width: 0; }

  .welcome {
    flex: 1; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 40px 24px;
  }
  .welcome h1 { font-size: clamp(22px, 6vw, 28px); font-weight: 500; letter-spacing: -0.5px; }

  .msg-row { padding: 4px 14px; }
  .msg-row.user { display: flex; justify-content: flex-end; }
  .msg-row.user .bubble {
    background: #2f2f2f; color: #ececec;
    padding: 11px 15px; border-radius: 20px;
    max-width: min(82%, 340px);
    font-size: clamp(13px, 3.8vw, 15px); line-height: 1.55; word-break: break-word;
  }
  .msg-row.ai { display: flex; flex-direction: column; }
  .ai-content {
    font-size: clamp(13px, 3.8vw, 15px); line-height: 1.72;
    color: #ececec; padding: 4px 0; white-space: pre-wrap; word-break: break-word;
  }

  /* ── IMAGE UPLOAD BUBBLE ── */
  .img-bubble {
    background: #2a2a2a; border-radius: 14px; overflow: hidden;
    width: min(160px, 44vw); border: 1px solid #3a3a3a;
  }
  .img-placeholder {
    width: 100%; aspect-ratio: 4/3;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; background: #1a1a1a;
  }
  .img-placeholder img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .img-placeholder .emoji-fallback {
    font-size: clamp(32px, 9vw, 48px);
    background: linear-gradient(135deg, #c8956a 0%, #d4a07a 40%, #b8805a 100%);
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .acne-d { position: absolute; border-radius: 50%; background: #8b3a3a; opacity: 0.88; }
  .img-caption { font-size: 11px; color: #8e8ea0; padding: 5px 10px 7px; text-align: center; }

  /* ── TYPING ── */
  .typing-row { padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
  .bubble-icon { width: 22px; height: 22px; flex-shrink: 0; animation: bubblePulse 0.9s ease-in-out infinite; }
  @keyframes bubblePulse {
    0%,100% { transform: scale(1); opacity: 0.55; }
    50%      { transform: scale(1.22); opacity: 1; }
  }
  .typing-dots { display: flex; gap: 4px; align-items: center; }
  .typing-dots span {
    width: 7px; height: 7px; background: #666;
    border-radius: 50%; animation: blink 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,60%,100% { opacity: 0.3; transform: scale(0.85); }
    30%         { opacity: 1; transform: scale(1); }
  }

  /* ── PRODUCT CARDS (multi) ── */
  .product-cards-wrap {
    padding: 4px 0; overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .product-cards-wrap::-webkit-scrollbar { height: 0; }
  .product-cards {
    display: flex; flex-direction: row; gap: 8px;
    width: max-content; padding: 2px 2px 6px;
  }
  .product-card {
    width: 120px; flex-shrink: 0;
    background: #2a2a2a; border: 1px solid #3a3a3a;
    border-radius: 10px; overflow: hidden;
    opacity: 0; transform: translateY(6px) scale(0.96);
    transition: opacity 0.3s ease, transform 0.3s ease; cursor: pointer;
  }
  .product-card.visible { opacity: 1; transform: translateY(0) scale(1); }
  .product-card:hover { border-color: #555; }
  .card-img {
    width: 100%; height: 110px; object-fit: cover;
    display: block; background: #1a1a1a;
  }
  .card-img-placeholder {
    width: 100%; height: 110px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; background: #1e1e1e;
  }
  .card-body { padding: 7px 8px 9px; }
  .card-name { font-size: 12px; font-weight: 600; color: #ececec; line-height: 1.3; }
  .card-sub  { font-size: 10px; color: #8e8ea0; margin-top: 2px; }

  /* ══════════════════════════════════════
     SINGLE PRODUCT LINK CARD
     Google Shopping style — full width
  ══════════════════════════════════════ */
  .single-product-card {
    display: flex; align-items: center; gap: 12px;
    background: #2a2a2a; border: 1px solid #3a3a3a;
    border-radius: 14px; overflow: hidden;
    padding: 10px; cursor: pointer;
    text-decoration: none; color: inherit;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.2s;
    max-width: 320px;
  }
  .single-product-card.visible { opacity: 1; transform: translateY(0); }
  .single-product-card:hover { border-color: #555; }

  .sp-img-wrap {
    width: 72px; height: 72px; flex-shrink: 0;
    border-radius: 10px; overflow: hidden; background: #1a1a1a;
  }
  .sp-img-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .sp-img-wrap .sp-img-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; background: #1e1e1e;
  }

  .sp-info { flex: 1; min-width: 0; }
  .sp-brand {
    font-size: 10px; color: #8e8ea0; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 3px;
  }
  .sp-name {
    font-size: 13px; font-weight: 700; color: #ececec;
    line-height: 1.3; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sp-desc {
    font-size: 11px; color: #aaa; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .sp-cta {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 7px; background: #3b82f6; color: white;
    font-size: 11px; font-weight: 600; padding: 5px 10px;
    border-radius: 20px; text-decoration: none;
  }
  .sp-cta svg { width: 10px; height: 10px; fill: none; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  /* ── CALENDAR OVERLAY ── */
  .calendar-overlay {
    position: fixed; inset: 0; background: #181818;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: clamp(16px, 4vw, 28px);
    z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .calendar-overlay.show { opacity: 1; pointer-events: all; }
  .calendar-title {
    font-size: clamp(13px, 3.8vw, 16px); font-weight: 600;
    color: #ececec; letter-spacing: -0.2px;
    opacity: 0; transition: opacity 0.6s ease 0.2s;
  }
  .calendar-overlay.show .calendar-title { opacity: 1; }
  .calendar-weeks { display: flex; gap: clamp(8px, 3vw, 18px); align-items: flex-start; }
  .week-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .week-card.show { opacity: 1; transform: translateY(0); }
  .skin-photo {
    width: clamp(80px, 24vw, 110px); height: clamp(80px, 24vw, 110px);
    border-radius: 12px; overflow: hidden;
    border: 2px solid #3a3a3a; background: #2a2a2a; position: relative;
  }
  .skin-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .skin-photo .skin-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 8vw, 38px); background: #2a2a2a;
  }
  .skin-photo .acne-overlay { position: absolute; inset: 0; pointer-events: none; }
  .skin-photo .acne-overlay span { position: absolute; border-radius: 50%; background: #8b3a3a; }
  .week-label {
    font-size: clamp(10px, 2.8vw, 12px); font-weight: 600;
    color: #8e8ea0; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .week-arrow {
    font-size: clamp(14px, 4vw, 20px); color: #444;
    flex-shrink: 0; margin-top: clamp(32px, 10vw, 45px);
  }

  /* ── BOTTOM INPUT ── */
  .bottom-area {
    flex-shrink: 0; padding: 8px 12px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .input-pill {
    background: #2f2f2f; border-radius: 28px;
    padding: 9px 9px 9px 15px;
    display: flex; align-items: flex-end; gap: 8px;
  }
  .plus-btn {
    width: 32px; height: 32px; background: #424242;
    border: none; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-bottom: 1px;
  }
  .plus-btn svg { width: 17px; height: 17px; stroke: #ececec; fill: none; stroke-width: 2.2; }
  .fake-input {
    flex: 1; font-size: clamp(14px, 3.8vw, 15px); font-family: inherit;
    color: #ececec; line-height: 1.5; min-height: 22px;
    padding: 2px 0; word-break: break-word;
  }
  .fake-input.empty { color: #8e8ea0; }
  .cursor {
    display: inline-block; width: 2px; height: 15px;
    background: #ececec; margin-left: 1px; vertical-align: middle;
    animation: cursorBlink 0.55s ease-in-out infinite;
  }
  @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }
  .right-btns { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
  .mic-btn {
    width: 34px; height: 34px; background: none; border: none;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; border-radius: 50%;
  }
  .mic-btn svg { width: 19px; height: 19px; fill: #8e8ea0; }
  .send-btn {
    width: 34px; height: 34px; background: #ececec; border: none;
    border-radius: 50%; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .send-btn svg { width: 15px; height: 15px; fill: none; stroke: #212121; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeUp 0.3s ease forwards; }


</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="menu-btn">
      <span></span><span></span><span></span>
      <div class="dot"></div>
    </button>
    <button class="model-selector">
      ChatGPT
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>
  <div class="topbar-right">
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
    </button>
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
      </svg>
    </button>
  </div>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome"><h1>Ready when you are.</h1></div>
</div>

<div class="calendar-overlay" id="calOverlay">
  <div class="calendar-title">Real results. Real skin. 🌿</div>
  <div class="calendar-weeks">
    <div class="week-card" id="wk1">
      <div class="skin-photo">
        <img id="calImg1" src="" alt="Week 1"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="skin-fallback" style="display:none">
          😟
          <div class="acne-overlay">
            <span style="width:10px;height:10px;top:22%;left:28%;opacity:0.9;"></span>
            <span style="width:7px;height:7px;top:38%;right:24%;opacity:0.8;"></span>
            <span style="width:8px;height:8px;bottom:26%;left:24%;opacity:0.85;"></span>
            <span style="width:6px;height:6px;top:50%;left:40%;opacity:0.75;"></span>
          </div>
        </div>
      </div>
      <div class="week-label">Week 1</div>
    </div>
    <div class="week-arrow">→</div>
    <div class="week-card" id="wk2">
      <div class="skin-photo">
        <img id="calImg2" src="" alt="Week 2"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="skin-fallback" style="display:none">
          😐
          <div class="acne-overlay">
            <span style="width:5px;height:5px;top:24%;left:30%;opacity:0.45;"></span>
            <span style="width:4px;height:4px;top:40%;right:26%;opacity:0.35;"></span>
          </div>
        </div>
      </div>
      <div class="week-label">Week 2</div>
    </div>
    <div class="week-arrow">→</div>
    <div class="week-card" id="wk4">
      <div class="skin-photo">
        <img id="calImg4" src="" alt="Week 4"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="skin-fallback" style="display:none">😊</div>
      </div>
      <div class="week-label">Week 4</div>
    </div>
  </div>
</div>

<div class="bottom-area">
  <div class="input-pill">
    <button class="plus-btn">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="fake-input empty" id="fakeInput">Ask anything</div>
    <div class="right-btns">
      <button class="mic-btn">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="send-btn">
        <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </div>
</div>



<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
const msgsEl     = document.getElementById('messages');
const fakeInput  = document.getElementById('fakeInput');

const calOverlay = document.getElementById('calOverlay');

// ════════════════════════════════════════════════════
//  ★★★  CHANGE YOUR LINKS HERE — nothing else needed  ★★★
// ════════════════════════════════════════════════════

// Acne photo the user "uploads" at the start
const UPLOADED_PHOTO_URL = 'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824';

// Calendar progress photos
const WEEK1_URL = 'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824';
const WEEK2_URL = 'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824';
const WEEK4_URL = 'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824';

// ── SINGLE PRODUCT CARD ──────────────────────────────
const SINGLE_PRODUCT = {
  url:   'https://www.purcurie.com/product/kogic-acid-and-turmeric-foaming-face-wash',
  img:   'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824', // ← replace with your product image
  brand: 'Purcurie',
  name:  'Kojic Acid & Turmeric Foaming Face Wash',
  desc:  'Brightens dark spots, calms inflammation & prevents breakouts — in one daily wash.',
};
// ────────────────────────────────────────────────────

// Multi product cards
const PRODUCTS = [
  { img: 'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824', name: 'Serum',         sub: 'Brightening' },
  { img: 'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824', name: 'Face Mask',     sub: 'Deep cleanse' },
  { img: 'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824', name: 'Cream',         sub: 'Moisturiser' },
  { img: 'https://cdn.shopify.com/s/files/1/0984/6843/0146/files/Screenshot_2026-03-28_at_2.36.48_PM.png?v=1774688824', name: 'Treatment Gel', sub: 'Spot fix' },
];
const FALLBACK_EMOJIS = ['💧','🌿','✨','🧴'];
// ── INGREDIENT CARDS ──────────────────────────────
const INGREDIENTS = [
  { img: 'REPLACE_KOJICACID_IMAGE_URL', name: 'Kojic Acid',  sub: 'Fades dark spots' },
  { img: 'REPLACE_TURMERIC_IMAGE_URL',  name: 'Turmeric',    sub: 'Reduces inflammation' },
];
const FALLBACK_INGR = ['🌟', '🌿'];

// ════════════════════════════════════════════════════

document.getElementById('calImg1').src = WEEK1_URL;
document.getElementById('calImg2').src = WEEK2_URL;
document.getElementById('calImg4').src = WEEK4_URL;

function scrollBot() { msgsEl.scrollTop = msgsEl.scrollHeight; }
function removeWelcome() { const w = document.getElementById('welcome'); if (w) w.remove(); }
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function typeInBar(text, speed) {
  fakeInput.classList.remove('empty');
  const cur = document.createElement('span');
  cur.className = 'cursor';
  for (let i = 0; i < text.length; i++) {
    fakeInput.textContent = text.slice(0, i + 1);
    fakeInput.appendChild(cur);
    await sleep(speed + (Math.random() * 10 - 5));
  }
  fakeInput.textContent = text;
}
function clearBar() {
  fakeInput.innerHTML = '';
  fakeInput.textContent = 'Ask anything';
  fakeInput.classList.add('empty');
}

function addUser(text) {
  removeWelcome();
  const row = document.createElement('div');
  row.className = 'msg-row user fade-in';
  row.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  msgsEl.appendChild(row);
  scrollBot();
}

function addImageUpload() {
  removeWelcome();
  const row = document.createElement('div');
  row.className = 'msg-row user fade-in';

  const imgEl = document.createElement('img');
  imgEl.src = UPLOADED_PHOTO_URL;
  imgEl.alt = 'Uploaded photo';
  imgEl.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';

  const placeholder = document.createElement('div');
  placeholder.className = 'img-placeholder';

  const fallback = document.createElement('div');
  fallback.className = 'emoji-fallback';
  fallback.style.display = 'none';
  fallback.innerHTML = `😟
    <div class="acne-d" style="width:11px;height:11px;top:22%;left:28%;"></div>
    <div class="acne-d" style="width:8px;height:8px;top:38%;right:24%;"></div>
    <div class="acne-d" style="width:9px;height:9px;bottom:26%;left:24%;"></div>
    <div class="acne-d" style="width:6px;height:6px;top:50%;left:40%;"></div>`;

  imgEl.onerror = () => { imgEl.style.display = 'none'; fallback.style.display = 'flex'; };

  placeholder.appendChild(imgEl);
  placeholder.appendChild(fallback);

  const caption = document.createElement('div');
  caption.className = 'img-caption';

function showTyping() {
  removeWelcome();

  row.className = 'typing-row fade-in';
  row.id = 'typing';
  row.innerHTML = `
    <svg class="bubble-icon" viewBox="0 0 24 24" fill="none">
      <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="#8e8ea0"/>
    </svg>

  scrollBot();
}
function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// speed: lowered from 14-15 → 6 for fast readable streaming
async function streamAI(text, speed = 6) {
  removeTyping();
  const row = document.createElement('div');
  row.className = 'msg-row ai fade-in';
  const el = document.createElement('div');
  el.className = 'ai-content';
  row.appendChild(el);
  msgsEl.appendChild(row);
  for (let i = 0; i < text.length; i++) {
    el.textContent = text.slice(0, i + 1);
    scrollBot();
    await sleep(speed);
  }
}

async function showCards(items, fallbacks) {
  removeTyping();
  const row = document.createElement('div');
  row.className = 'msg-row ai fade-in';
  const wrap = document.createElement('div');
  wrap.className = 'product-cards-wrap';
  const grid = document.createElement('div');
  grid.className = 'product-cards';

  items.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'product-card';
    const isPlaceholder = !p.img || p.img.startsWith('REPLACE_');
    card.innerHTML = `
      ${isPlaceholder
        ? `<div class="card-img-placeholder">${fallbacks[i]}</div>`
        : `<img class="card-img" src="${p.img}" alt="${p.name}"
               onerror="this.style.display='none';this.nextSibling.style.display='flex'">
           <div class="card-img-placeholder" style="display:none">${fallbacks[i]}</div>`
      }
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-sub">${p.sub}</div>
      </div>
    `;
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  row.appendChild(wrap);
  msgsEl.appendChild(row);
  scrollBot();

  const cards = grid.querySelectorAll('.product-card');
  for (let i = 0; i < cards.length; i++) {
    await sleep(160);
    cards[i].classList.add('visible');
    scrollBot();
  }
}
